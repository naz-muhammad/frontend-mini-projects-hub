<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#202124;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:white;
    padding:25px;
    border-radius:10px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    font-size:16px;
}

button{
    padding:12px 18px;
    cursor:pointer;
}

.task-list{
    margin-top:20px;
}

.task{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    border: 1px solid #ddd;
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
}

.task p{
    flex:1;
}

.delete-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 12px;
}


</style>
<body>

<div class="container">
    <h1>To-do App</h1>

    <div class="input-box">
        <input
            type="text"
            id="taskInput"
            placeholder="Enter a task..."
        >
        <button id="addBtn">Add Task</button>
    </div>

    <div class="task-list">
        <!-- Tasks will be added here -->
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
