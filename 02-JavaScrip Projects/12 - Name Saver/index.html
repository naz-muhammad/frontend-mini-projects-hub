<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Saver</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Name Saver</h1>

    <input
        type="text"
        id="nameInput"
        placeholder="Enter your name..."
    >

    <button id="saveBtn">
        Save Name
    </button>

    <button id="clearBtn">
        Clear
    </button>

    <p id="message">
        Welcome!
    </p>

</div>

<script src="script.js"></script>

</body>
</html>
