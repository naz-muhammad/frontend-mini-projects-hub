<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Question

Create buttons:

Red
Blue
Green
Yellow

When a button is clicked, change the page background color. -->

    <div class="container">
        <button class="button redbtn">Red</button>
        <button class="button bluebtn">Blue</button>
        <button class="button greenbtn">Green</button>
        <button class="button yellowbtn">Yellow</button>
    </div>

    <script src="./app.js"></script>
</body>

</html>
